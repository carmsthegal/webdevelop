<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Guess the State Game</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin-top: 50px;
      background-color: #2e8b57; /* Minecraft green background */
      color: #fff;
    }
    .container {
      margin: 0 auto;
      width: 300px;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 10px;
      background-color: #4caf50; /* Minecraft green for container */
    }
    input[type="text"] {
      padding: 10px;
      margin: 10px 0;
      width: 100%;
      font-size: 16px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      border: none;
      background-color: #388e3c; /* Dark green Minecraft button */
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #2c6f2d; /* Slightly darker green on hover */
    }
    .message {
      font-size: 18px;
      margin-top: 20px;
    }
    #play-again {
      display: none;
      margin-top: 20px;
    }
    h1 {
      font-size: 24px;
      margin-bottom: 20px;
    }
    .statemaster-points {
      margin-top: 10px;
      font-size: 18px;
      color: #fff;
    }

    /* Pop-up modal styles */
    #chickenjockey-popup {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    #chickenjockey-popup img {
      width: 400px;
      height: auto;
      border-radius: 10px;
      border: 5px solid #fff;
    }
    #close-popup {
      position: absolute;
      top: 10px;
      right: 10px;
      background-color: #f44336;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 50%;
      cursor: pointer;
    }
    #close-popup:hover {
      background-color: #d32f2f;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Guess the State Game</h1>
    <p>Guess the state! The computer will give you the first letter.</p>
    <p id="hint">First letter: <span id="first-letter"></span></p>
    <input type="text" id="guess" placeholder="Type your guess here..." />
    <button onclick="checkGuess()">Submit Guess</button>
    <div id="message" class="message"></div>
    <div id="statemaster-points" class="statemaster-points">Statemaster Points: 0</div>
    <button id="play-again" onclick="resetGame()">Play Again</button>
  </div>

  <!-- ChickenJockey Pop-up -->
  <div id="chickenjockey-popup">
    <button id="close-popup" onclick="closePopup()">X</button>
    <img src="assets/img/chickenjockey.jpg" alt="familia">
  </div>

  <script>
    // List of states and their fun facts
    const states = [
      { name: "Alabama", funFact: "Alabama is known as the ‘Heart of Dixie’." },
      { name: "Alaska", funFact: "Alaska has more coastline than all the other U.S. states combined." },
      { name: "Arizona", funFact: "Arizona is home to the Grand Canyon, one of the seven natural wonders of the world." },
      { name: "Arkansas", funFact: "Arkansas has the only active diamond mine in the U.S." },
      { name: "California", funFact: "California is home to the longest coastline in the U.S." },
      { name: "Colorado", funFact: "Colorado is known for its Rocky Mountains and is a popular destination for skiing." },
      { name: "Connecticut", funFact: "Connecticut is the birthplace of the American Constitution." },
      { name: "Delaware", funFact: "Delaware was the first state to ratify the U.S. Constitution." },
      { name: "Florida", funFact: "Florida is the only state that has a tropical climate and is home to the Everglades." },
      { name: "Georgia", funFact: "Georgia is the Peach State and is famous for its peaches." },
      { name: "Hawaii", funFact: "Hawaii is the only U.S. state made up entirely of islands." },
      { name: "Idaho", funFact: "Idaho is the leading producer of potatoes in the U.S." },
      { name: "Illinois", funFact: "Illinois is home to the famous skyscraper, the Willis Tower (formerly Sears Tower)." },
      { name: "Indiana", funFact: "Indiana is known for the Indianapolis 500 car race." },
      { name: "Iowa", funFact: "Iowa is known for its cornfields and is a major producer of corn in the U.S." },
      { name: "Kansas", funFact: "Kansas is famous for its tornadoes and flat landscape." },
      { name: "Kentucky", funFact: "Kentucky is the birthplace of bourbon whiskey." },
      { name: "Louisiana", funFact: "Louisiana is known for its unique culture and Mardi Gras celebrations." },
      { name: "Maine", funFact: "Maine is known for its beautiful lighthouses and lobster." },
      { name: "Maryland", funFact: "Maryland is known for its blue crabs and the Chesapeake Bay." },
      { name: "Massachusetts", funFact: "Massachusetts is home to Harvard University, the oldest university in the U.S." },
    ];

    let currentState;
    let firstLetter;
    let guessesLeft;
    let hintGiven;
    let wins = 0; // Track the number of wins

    // Function to start a new game
    function startGame() {
      currentState = states[Math.floor(Math.random() * states.length)];
      firstLetter = currentState.name.charAt(0).toUpperCase();
      guessesLeft = 3;
      hintGiven = false;

      // Display the first letter
      document.getElementById("first-letter").innerText = firstLetter;
      document.getElementById("guess").value = ''; // clear the input field
      document.getElementById("message").innerText = '';
      document.getElementById("message").style.color = 'black';
      document.getElementById("play-again").style.display = 'none'; // hide the Play Again button
      document.getElementById("guess").disabled = false; // Enable input field
    }

    // Function to check the guess
    function checkGuess() {
      let userGuess = document.getElementById("guess").value.trim();

      if (userGuess.toLowerCase() === currentState.name.toLowerCase()) {
        wins++; // Increment the win count
        document.getElementById("message").innerText = "Congratulations, you guessed the state!";
        document.getElementById("message").style.color = "green";
        document.getElementById("statemaster-points").innerText = `Statemaster Points: ${wins}`; // Update the win count
        document.getElementById("message").innerText += ` Fun Fact: ${currentState.funFact}`; // Show the fun fact
        document.getElementById("play-again").style.display = 'inline-block'; // show Play Again button
        document.getElementById("guess").disabled = true; // Disable input field after game ends
        showPopup(); // Show the ChickenJockey popup
      } else {
        guessesLeft--;
        if (guessesLeft > 0) {
          document.getElementById("message").innerText = `Wrong guess! You have ${guessesLeft} tries left.`;
          document.getElementById("guess").value = ''; // clear the input field after each guess
        } else {
          if (!hintGiven) {
            hintGiven = true;
            let secondLetter = currentState.name.charAt(1).toUpperCase();
            document.getElementById("message").innerText = `Wrong again! Here's a hint: The second letter is ${secondLetter}. You have 1 more try.`;
          } else {
            document.getElementById("message").innerText = `You lost! The correct state was: ${currentState.name}.`;
            document.getElementById("message").style.color = "red";
            document.getElementById("play-again").style.display = 'inline-block'; // show Play Again button
            document.getElementById("guess").disabled = true; // Disable input field after game ends
          }
        }
      }
    }

    // Function to close the popup
    function closePopup() {
      document.getElementById("chickenjockey-popup").style.display = "none";
    }

    // Function to show the popup with the image
    function showPopup() {
      document.getElementById("chickenjockey-popup").style.display = "flex";
    }

    // Function to reset the game
    function resetGame() {
      startGame();
    }

    // Start a new game when the page loads
    startGame();
  </script>

</body>
</html>
